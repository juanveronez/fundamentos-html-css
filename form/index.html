<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa Culturama</title>
</head>
<body>
  <header>
    <h1>Pesquisa online</h1>
  </header>
  <main>
    <section>
      <form action="" method="get">
        <!-- Sessão dados pessoais -->
        <fieldset>
          <legend>Dados pessoais</legend>
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" required>
          <br>
          <label for="age">Idade</label>
          <input id="age" name="age" type="number" required min="12" max="100">
          <br>
          <label for="birthDate">Data de nascimento</label>
          <input id="birthDate" type="date" name="birthDate">
          <br>
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email">
          <br>
          <label for="phone">Telefone</label>
          <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" placeholder="DDD + número">
          <br>
          <label for="photo">Upload de foto</label>
          <input type="file" accept="image/*" name="photo" id="photo">
          <br>
        </fieldset>

        <fieldset>
          <legend>Perfil</legend>
          <span3>Gênero:</span3>
          <input type="radio" name="gender" id="gender-female" value="female">
          <label for="gender-female" >Feminino</label>
          <input type="radio" name="gender" id="gender-male" value="male">
          <label for="gender-male" >Masculino</label>
          <input type="radio" name="gender" id="gender-not-info" value="notInformed">
          <label for="gender-not-info" >Prefiro não informar</label>
          <br>
          <label for="maritalStatus">Estado civil</label>
          <select name="maritalStatus" id="maritalStatus">
            <option value="notInformed">Selecione....</option>
            <option value="solteiro">Solteiro</option>
            <option value="casado">Casado</option>
            <option value="divorciado">Divorciado</option>
            <option value="viuvo">Viúvo</option>
          </select>
          <br>
          <label for="state">Estado</label>
          <select name="state" id="state">
            <option value="notInformed">Selecione....</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espirito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MT">Mato Grosso</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
          </select>
          <br>
          <label for="city">Cidade</label>
          <input type="text" name="city" id="city">
        </fieldset>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
</body>
</html>
