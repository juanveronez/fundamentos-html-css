<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa Culturama</title>
</head>
<body>
  <header>
    <h1>Pesquisa online</h1>
  </header>
  <main>
    <section>
      <form action="" method="get">
        <!-- Sessão dados pessoais -->
        <fieldset>
          <legend>Dados pessoais</legend>
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" required>
          <br>
          <label for="age">Idade</label>
          <input id="age" name="age" type="number" required min="12" max="100">
          <br>
          <label for="birthDate">Data de nascimento</label>
          <input id="birthDate" type="date" name="birthDate">
          <br>
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email">
          <br>
          <label for="phone">Telefone</label>
          <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" placeholder="DDD + número">
          <br>
          <label for="photo">Upload de foto</label>
          <input type="file" accept="image/*" name="photo" id="photo">
          <br>
        </fieldset>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
</body>
</html>
