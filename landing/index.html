<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon-tecboard-preto-e-roxo.svg" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <title>Tecboard</title>
</head>
<body>
  <div>
    <header>
      <h1 aria-label="Tecboard">
        <img
          src="assets/icons/logo-tecboard-branco.svg"
          alt="Logo Tecboard na cor branca"
        >
      </h1>
      <button aria-label="trocar entre light e dark mode">
        <img
          src="assets/icons/icon-light-mode.svg"
          alt="ícone de um sol na cor roxa"
        >
      </button>
    </header>
    <main>
      <section>
        <div>
          <h2><span>Fique de olho</span><br> no que importa</h2>
          <p>Monitoramento em tempo real com alertas inteligentes para sua aplicação nunca sair do ar sem você saber.</p>
        </div>
        <a href="#">Testar versão demo</a>
        <img
          src="assets/img/celulares-sobrepostos-desktop.png"
          alt="Dois celulares sobrepostos com o aplicativo Tecboard aberto e um fundo roxo"
        >
      </section>
    </main>
  </div>

</body>
</html>
